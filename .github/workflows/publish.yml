name: Publish to PyPI / TestPyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target PyPI Repository'
        required: true
        type: choice
        options:
          - pypi
          - testpypi
        default: 'testpypi'
      version_override:
        description: 'Optional: Version override (e.g. 1.0.1). Leave empty to use version from toolpickr/_version.py'
        required: false
        type: string

jobs:
  build-n-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest

    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing (OIDC)
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Apply version override if provided
        if: ${{ github.event.inputs.version_override != '' }}
        shell: bash
        run: |
          echo "Overriding version with: ${{ github.event.inputs.version_override }}"
          sed -i "s/__version__ = .*/__version__ = \"${{ github.event.inputs.version_override }}\"/" toolpickr/_version.py

      - name: Build binary wheel and source tarball
        run: python -m build

      - name: Determine Target PyPI Repository
        id: determine-target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "repository=pypi" >> $GITHUB_OUTPUT
            echo "url=https://upload.pypi.org/legacy/" >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event.inputs.target }}" = "pypi" ]; then
              echo "repository=pypi" >> $GITHUB_OUTPUT
              echo "url=https://upload.pypi.org/legacy/" >> $GITHUB_OUTPUT
            else
              echo "repository=testpypi" >> $GITHUB_OUTPUT
              echo "url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Publish package distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ steps.determine-target.outputs.url }}
          # OIDC Trusted Publishing works for both PyPI and TestPyPI
          # by matching the publisher registered on each platform.

